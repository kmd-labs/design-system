<button
  type="button"
  role="switch"
  class="toggle"
  [class.toggle--sm]="size() === 'sm'"
  [class.toggle--checked]="checked()"
  [class.toggle--full]="fullWidth()"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || label() || null"
  [appTooltip]="tooltipText()"
  [disabled]="disabled()"
  (click)="onToggle()">
  @if (label() || description() || swatchColor()) {
    <span class="toggle__content">
      @if (swatchColor(); as swatch) {
        <span class="toggle__swatch" [style.background]="swatch" aria-hidden="true"></span>
      }
      <span class="toggle__text">
        @if (label()) {
          <span class="toggle__label">{{ label() }}</span>
        }
        @if (description()) {
          <span class="toggle__description">{{ description() }}</span>
        }
      </span>
    </span>
  }
  <span class="toggle__track" aria-hidden="true">
    <span class="toggle__thumb"></span>
  </span>
</button>
