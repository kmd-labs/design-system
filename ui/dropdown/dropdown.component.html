<div
  class="dropdown"
  [class.dropdown--open]="isOpen()"
  [class.dropdown--full]="fullWidth()">
  <app-button
    [variant]="variant()"
    [active]="isOpen()"
    [iconOnly]="iconOnly()"
    [extraClass]="fullWidth() ? 'dropdown__trigger-btn--full' : ''"
    [ariaLabel]="ariaLabel() || triggerText()"
    [titleText]="ariaLabel() || selectedOption()?.label || triggerText() || null"
    (btnClick)="toggle()">
    @if (displayedIcon()) {
      <lucide-icon [img]="displayedIcon()" [size]="iconSize()"></lucide-icon>
    }
    @if (!iconOnly()) {
      <span class="dropdown__trigger-label">{{ triggerText() }}</span>
      <lucide-icon
        class="dropdown__chevron"
        [class.dropdown__chevron--open]="isOpen()"
        [img]="chevronDownIcon"
        [size]="13">
      </lucide-icon>
    }
  </app-button>

  @if (isOpen()) {
    <div
      class="dropdown__menu"
      [class.dropdown__menu--right]="align() === 'right'"
      [class.dropdown__menu--up]="direction() === 'up'"
      [style.min-width]="menuMinWidth() ?? null"
      [style.--dropdown-menu-blur]="blur() ? 'var(--blur-' + blur() + ')' : '0px'"
      [attr.role]="options().length ? 'listbox' : 'region'"
      [attr.aria-label]="ariaLabel() || triggerText()">
      @if (options().length > 0) {
        @for (opt of options(); track opt.value) {
          @let isSelected = opt.value === value();
          @let isCta = opt.cta || opt.variant === 'cta';
          <button
            type="button"
            class="dropdown__item"
            [class.dropdown__item--selected]="isSelected && showCheck()"
            [class.dropdown__item--cta]="isCta"
            role="option"
            [attr.aria-selected]="isSelected"
            (click)="select(opt)">
            @if (opt.icon) {
              <lucide-icon [img]="opt.icon" [size]="14"></lucide-icon>
            }
            <span class="dropdown__item-label">{{ opt.label }}</span>
            @if (opt.badge) {
              <span class="dropdown__item-badge">{{ opt.badge }}</span>
            }
            @if (isSelected && !isCta && showCheck()) {
              <lucide-icon class="dropdown__item-check" [img]="checkIcon" [size]="14"></lucide-icon>
            }
          </button>
        }
      } @else {
        <div class="dropdown__custom">
          <ng-content></ng-content>
        </div>
      }
    </div>
  }
</div>
