@if (isVisible) {
  <div
    class="splash"
    [class.splash--fading]="isFading"
    [class.splash--error]="isError"
    role="status"
    aria-live="polite"
    [attr.aria-label]="currentStatus">
    <div class="splash__inner">
      <div class="splash__mark" aria-hidden="true">
        <img
          class="splash__logo"
          src="assets/design-system/logo/kmd-black-orange.svg"
          alt=""
          (animationend)="onRevealAnimationEnd($event)">
      </div>

      <div class="splash__track" aria-hidden="true">
        <span class="splash__fill" [style.width.%]="currentProgress"></span>
      </div>

      <p class="splash__status">{{ currentStatus }}</p>
    </div>
  </div>
}
